[package]
name = "echoroom-server"
version.workspace = true
edition.workspace = true
default-run = "echoroom-server"

[[bin]]
name = "echoroom-server"
path = "src/main.rs"

[[bin]]
name = "sim_clients"
path = "src/bin/sim_clients.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
echoroom-protocol = { path = "../protocol" }
rand = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
