[package]
name = "echoroom-client"
version.workspace = true
edition.workspace = true
default-run = "Echo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
echoroom-protocol = { path = "../../protocol" }
audiopus = "0.2.0"
anyhow = "1.0.104"
wasapi = "0.15"
hound = "3.5.1"
nnnoiseless = "0.5.2"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_System_SystemInformation", "Wdk_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp"] }
windows-core = "0.62.2"

[lib]
name = "echoroom_client_lib"
path = "src/lib.rs"

[[bin]]
name = "Echo"
path = "src/main.rs"
