[package]
name = "echoroom-client"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
echoroom-protocol = { path = "../../protocol" }
audiopus = "0.2.0"
anyhow = "1.0.104"
wasapi = "0.15"
hound = "3.5.1"
nnnoiseless = "0.5.2"

[lib]
name = "echoroom_client_lib"
path = "src/lib.rs"

[[bin]]
name = "echoroom-client"
path = "src/main.rs"
