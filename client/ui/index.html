<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoRoom</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="title">EchoRoom</span>
    <span class="status" id="conn-status">未连接</span>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-title">在线</div>
      <ul class="online-list" id="online-list"></ul>
    </aside>

    <div class="app-main">
      <section class="members" id="members"></section>
      <section class="chat" id="chat"></section>

      <footer class="inputbar">
        <input id="chat-input" type="text" placeholder="连接后即可发言…" disabled />
        <button id="chat-send" disabled>发送</button>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
