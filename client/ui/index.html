<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="title">Echo</span>
    <div class="topbar-right">
      <span class="status" id="conn-status">未连接</span>
      <button class="topbar-gear" id="open-settings" title="设置" hidden></button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-title">在线</div>
      <ul class="online-list" id="online-list"></ul>
    </aside>

    <div class="app-main">
      <section class="members" id="members">
        <section class="view" id="view" hidden>
          <div class="view-stage" id="view-stage"></div>
          <button class="view-btn view-close" id="view-close" title="关闭">×</button>
          <span class="view-viewers" id="view-viewers" hidden></span>
          <button class="view-btn view-vol" id="view-vol" title="投屏音量" hidden></button>
          <button class="view-btn view-fs" id="view-fs" title="全屏">⛶</button>
          <button class="view-btn view-settings" id="view-settings" title="设置" hidden>⚙</button>
          <button class="view-btn view-stop" id="view-stop-share" title="停止投屏（一并关闭摄像头）" hidden>停止投屏</button>
          <span class="view-stats" id="view-stats" hidden></span>
        </section>
      </section>
      <section class="chat" id="chat"></section>

      <footer class="inputbar">
        <input id="chat-input" type="text" placeholder="连接后即可发言…" disabled />
        <button id="chat-send" disabled>发送</button>
      </footer>
    </div>
  </div>

  <div class="settings-page" id="settings-page" hidden>
    <aside class="settings-nav">
      <button class="settings-back" id="settings-back">‹ 返回</button>
      <nav class="settings-cats">
        <button class="settings-cat active" data-cat="account">账号</button>
        <button class="settings-cat" data-cat="device">设备</button>
        <button class="settings-cat" data-cat="sound">音效</button>
        <button class="settings-cat" data-cat="appearance">外观</button>
      </nav>
      <div class="settings-version" id="settings-version">v0.3.0</div>
    </aside>
    <div class="settings-body">
      <section class="settings-pane" data-pane="account">
        <h2 class="settings-title">账号</h2>
        <div class="account-row">
          <div class="account-avatar" id="account-avatar"></div>
          <div class="account-info">
            <div class="account-nick" id="account-nick">—</div>
            <div class="account-name" id="account-name">—</div>
          </div>
        </div>
        <button class="settings-btn" id="account-profile">修改资料</button>
        <div class="settings-divider"></div>
        <button class="settings-btn danger" id="account-logout">退出登录</button>
      </section>
      <section class="settings-pane" data-pane="device" hidden>
        <h2 class="settings-title">设备</h2>
        <div class="settings-row">
          <label class="settings-label" for="dev-input">麦克风</label>
          <select class="settings-select" id="dev-input"></select>
        </div>
        <div class="settings-row">
          <label class="settings-label" for="dev-output">扬声器</label>
          <select class="settings-select" id="dev-output"></select>
        </div>
        <div class="settings-row">
          <label class="settings-label" for="dev-camera">摄像头</label>
          <select class="settings-select" id="dev-camera"></select>
        </div>
        <div class="settings-hint" id="device-hint" hidden></div>
      </section>
      <section class="settings-pane" data-pane="sound" hidden>
        <h2 class="settings-title">音效</h2>
        <div class="sound-volume">
          <label for="sound-volume">音量</label>
          <input id="sound-volume" type="range" min="0" max="100" step="1" />
          <span class="sound-volume-val" id="sound-volume-val">50%</span>
        </div>
        <div class="sound-list" id="sound-list"></div>
      </section>
      <section class="settings-pane" data-pane="appearance" hidden>
        <h2 class="settings-title">外观</h2>
        <div id="theme-section">
          <div class="appearance-label">主题</div>
          <div class="theme-grid" id="theme-grid"></div>
        </div>
        <div id="bg-section">
          <div class="appearance-label">背景图</div>
          <div class="bg-row">
            <button class="settings-btn" id="bg-pick">选择图片</button>
            <button class="settings-btn" id="bg-clear">清除</button>
            <input id="bg-file" type="file" accept="image/*" hidden />
          </div>
          <div class="bg-preview" id="bg-preview" hidden></div>
          <div class="settings-hint" id="bg-hint" hidden></div>
        </div>
      </section>
    </div>
  </div>

  <div class="setup-mask hidden" id="setup-mask">
    <div class="setup-panel">
      <h2 id="setup-title">登录 Echo</h2>
      <input id="setup-server" type="text" maxlength="64" value="127.0.0.1:9000" placeholder="服务器地址 host:port" />
      <input id="setup-account" type="text" maxlength="20" placeholder="账号（3-20 位字母数字下划线，不能以 _ 开头）" autocomplete="off" />
      <input id="setup-password" type="password" maxlength="64" placeholder="密码（6-64 位英文/数字/符号）" autocomplete="off" />
      <input id="setup-invite" type="text" maxlength="64" placeholder="邀请码" hidden />
      <div class="setup-error" id="setup-error" hidden></div>
      <button id="setup-submit">登录</button>
      <button class="setup-link" id="setup-toggle" type="button">没有账号？注册</button>
    </div>
  </div>

  <div class="setup-mask hidden" id="profile-mask">
    <div class="setup-panel">
      <h2>个人资料</h2>
      <div class="profile-avatar-row">
        <div class="profile-avatar-preview" id="profile-avatar-preview"></div>
        <button class="setup-link" id="profile-avatar-pick" type="button">选择图片</button>
        <input id="profile-avatar-file" type="file" accept="image/*" hidden />
      </div>
      <input id="profile-nickname" type="text" maxlength="24" placeholder="昵称（1-24 字符）" />
      <div class="setup-error" id="profile-error" hidden></div>
      <button id="profile-submit">保存</button>
      <button class="setup-link" id="profile-skip" type="button">以后再说</button>
    </div>
  </div>

  <script src="features.js"></script>
  <script src="video_capture.js"></script>
  <script src="video_view.js"></script>
  <script src="app.js"></script>
</body>
</html>
