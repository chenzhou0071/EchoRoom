<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="title">Echo</span>
    <span class="status" id="conn-status">未连接</span>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-title">在线</div>
      <ul class="online-list" id="online-list"></ul>
    </aside>

    <div class="app-main">
      <section class="members" id="members">
        <section class="view" id="view" hidden>
          <div class="view-stage" id="view-stage"></div>
          <button class="view-btn view-close" id="view-close" title="关闭">×</button>
          <span class="view-viewers" id="view-viewers" hidden></span>
          <button class="view-btn view-vol" id="view-vol" title="投屏音量" hidden></button>
          <button class="view-btn view-fs" id="view-fs" title="全屏">⛶</button>
          <button class="view-btn view-settings" id="view-settings" title="设置" hidden>⚙</button>
          <button class="view-btn view-stop" id="view-stop-share" title="停止投屏（一并关闭摄像头）" hidden>停止投屏</button>
          <span class="view-stats" id="view-stats" hidden></span>
        </section>
      </section>
      <section class="chat" id="chat"></section>

      <footer class="inputbar">
        <input id="chat-input" type="text" placeholder="连接后即可发言…" disabled />
        <button id="chat-send" disabled>发送</button>
      </footer>
    </div>
  </div>

  <div class="setup-mask hidden" id="setup-mask">
    <div class="setup-panel">
      <h2 id="setup-title">登录 Echo</h2>
      <input id="setup-server" type="text" maxlength="64" value="127.0.0.1:9000" placeholder="服务器地址 host:port" />
      <input id="setup-account" type="text" maxlength="20" placeholder="账号（3-20 位字母数字下划线，不能以 _ 开头）" autocomplete="off" />
      <input id="setup-password" type="password" maxlength="64" placeholder="密码（至少 6 位）" autocomplete="off" />
      <input id="setup-invite" type="text" maxlength="64" placeholder="邀请码" hidden />
      <div class="setup-error" id="setup-error" hidden></div>
      <button id="setup-submit">登录</button>
      <button class="setup-link" id="setup-toggle" type="button">没有账号？注册</button>
    </div>
  </div>

  <div class="setup-mask hidden" id="profile-mask">
    <div class="setup-panel">
      <h2>完善资料</h2>
      <input id="profile-nickname" type="text" maxlength="24" placeholder="昵称（1-24 字符）" />
      <div class="setup-error" id="profile-error" hidden></div>
      <button id="profile-submit">保存</button>
      <button class="setup-link" id="profile-skip" type="button">以后再说</button>
    </div>
  </div>

  <script src="video_capture.js"></script>
  <script src="video_view.js"></script>
  <script src="app.js"></script>
</body>
</html>
